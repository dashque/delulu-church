@let nameControl = form.controls.name;
@let emailControl = form.controls.email;
@let passwordControl = form.controls.password;
@let passwordConfirmationControl = form.controls.passwordConfirmation;
@let dateOfBirthControl = form.controls.dateOfBirth;
<form [formGroup]="form" tuiCardLarge tuiForm="m" class="form" [style.max-width.rem]="48" (submit)="onSubmit($event)">
  <tui-textfield>
    <label tuiLabel for="name">{{ 'register.form.labels.name' | transloco }}</label>
    <input [formControl]="nameControl" placeholder="John" tuiInput id="name" />
  </tui-textfield>
  <tui-error [formControl]="nameControl" />

  <tui-textfield iconStart="@tui.mail">
    <label tuiLabel for="email">{{ 'register.form.labels.email' | transloco }}</label>
    <input [formControl]="emailControl" placeholder="john@wick.com" tuiInput type="email" id="email" />
  </tui-textfield>
  <tui-error [formControl]="emailControl" />

  <tui-textfield iconStart="@tui.lock">
    <label tuiLabel for="password">{{ 'register.form.labels.password' | transloco }}</label>
    <input id="password" [formControl]="passwordControl" placeholder="Aa888888" tuiInput type="password" />
    <tui-icon tuiPassword />
  </tui-textfield>
  <tui-error [formControl]="passwordControl" />

  <tui-textfield iconStart="@tui.lock">
    <label tuiLabel for="passwordConfirmation">{{ 'register.form.labels.password_confirmation' | transloco }}</label>
    <input
      id="passwordConfirmation"
      [formControl]="passwordConfirmationControl"
      placeholder="Aa888888"
      tuiInput
      type="password"
    />
    <tui-icon tuiPassword />
  </tui-textfield>
  <tui-error [formControl]="passwordConfirmationControl" />

  <tui-textfield iconStart="@tui.calendar">
    <label tuiLabel for="dateOfBirth">{{ 'register.form.labels.date_of_birth' | transloco }}</label>
    <input id="dateOfBirth" [formControl]="dateOfBirthControl" tuiInputDate />
    <tui-calendar *tuiDropdown />
  </tui-textfield>

  <tui-error [formControl]="dateOfBirthControl" />

  <footer class="footer">
    <button tuiButton type="submit" [disabled]="form.invalid || isLoading()">
      <div *deluluLoader="isLoading">
        {{ 'register.actions.submit' | transloco }}
      </div>
    </button>

    <span class="divider"></span>

    <a routerLink="/login" class="link">{{ 'navigation-items.login' | transloco }}</a>
  </footer>
</form>
