name: Auto Assign and request review
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const allPossibleReviewers = ['dashque', 'tryproxy'];
            const reviewers = allPossibleReviewers.filter(
              (reviewer) => reviewer !== author
            );

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [author],
            });

            if (pr.draft || reviewers.length === 0) {
              core.info(
                pr.draft
                  ? 'Draft PR — skipping review requests'
                  : 'No eligible reviewers — skipping review requests'
              );
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers,
            });
